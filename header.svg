<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04060b"/><stop offset="0.6" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1a30"/>
  </linearGradient>
  <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="floor"><rect x="0" y="185" width="900" height="115" fill="url(#fade)"/></mask>
  <clipPath id="round"><rect width="900" height="300" rx="18"/></clipPath>
  <style>
    .in { animation: up 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes up { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
  </style>
</defs>
