  <g class="in">
    <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#tg)" letter-spacing="1">Mohammad El Zein</text>
