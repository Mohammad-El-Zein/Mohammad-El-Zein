<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454">
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#58a6ff"><animate attributeName="stop-color" values="#58a6ff;#a371f7;#3fb950;#58a6ff" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#a371f7"><animate attributeName="stop-color" values="#a371f7;#3fb950;#58a6ff;#a371f7" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <style>
    .row { animation: slide .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes slide { from { opacity:0; transform: translateX(-40px); } to { opacity:1; transform: translateX(0); } }
    .cat { font: 700 13px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #58a6ff; letter-spacing: 1.5px; }
    .tech { font: 400 15px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e6edf3; }
  </style>
</defs>
