<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
<defs>
  <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<line x1="100" y1="20" x2="800" y2="20" stroke="url(#tg)" stroke-width="2" stroke-linecap="round"/>
<text x="450" y="62" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#tg)" letter-spacing="1">Let's build something great together.</text>
</svg>