<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270">
<defs>
  <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="270">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7" stop-opacity="0.15"/><stop offset="1" stop-color="#3fb950"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 220 135" to="360 220 135" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect x="2" y="2" width="436" height="266" rx="16"/></clipPath>
  <style>
    .in { animation: up .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes up { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .label { font: 700 11px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 2px; }
    .title { font: 800 26px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .desc { font: 400 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .tag { font: 600 12.5px Consolas, 'SF Mono', Menlo, monospace; fill: #58a6ff; }
  </style>
</defs>
<rect x="2" y="2" width="436" height="266" rx="16" fill="url(#bg)"/>
<g clip-path="url(#c)">
  <rect x="-200" y="-20" width="140" height="320" fill="url(#sw)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;700" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="412" y="70" text-anchor="end" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" fill-opacity="0.05">03</text>
</g>
<rect x="2" y="2" width="436" height="266" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
<g class="in" style="animation-delay:0.40s">
  <circle cx="33" cy="34" r="4" fill="#58a6ff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="46" y="38" class="label">BACHELOR&#x27;S THESIS  ·  DEVOPS</text>
  <text x="28" y="76" class="title" fill="url(#tg)">Deployment Analyzer</text>
  <text x="28" y="112" class="desc">Graph-based tool that automatically determines</text>
<text x="28" y="134" class="desc">the deployment order of microservices from</text>
<text x="28" y="156" class="desc">Docker Compose and Kubernetes manifests,</text>
<text x="28" y="178" class="desc">comparing five graph algorithms.</text>
  <line x1="28" y1="200" x2="412" y2="200" stroke="#30363d"/>
  <text x="28" y="222" class="tag">Java 21 · Kubernetes · Docker Compose</text>
<text x="28" y="241" class="tag">Graph Algorithms · Graphviz · JMH</text>
</g>
</svg>